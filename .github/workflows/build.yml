name: Build APK
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip newest AISelect zip
        run: |
          Z=$(ls AISelect-v*.zip | sort -V | tail -1)
          mkdir proj && unzip -q "$Z" -d proj
          D=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          echo "PROJ=$D" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.PROJ }}
      - uses: actions/upload-artifact@v4
        with:
          name: AISelect-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
